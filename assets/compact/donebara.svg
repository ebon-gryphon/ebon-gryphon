<text x="500" y="70" text-anchor="middle" class="mono dim enter" font-size="14" letter-spacing="4" style=";animation-delay:0.05s">EBON-GRYPHON / A SPACE FOR IDEAS</text>
<text x="500" y="177" text-anchor="middle" font-size="25" class="muted enter" style=";animation-delay:0.05s">嘿！你好，我是</text>
<text x="500" y="281" text-anchor="middle" font-size="87" letter-spacing="10" font-weight="600" style="fill:#e4eee5" class=""><tspan class="letter" style="animation-delay:0.18s">郭</tspan><tspan class="letter" style="animation-delay:0.26s">雨</tspan><tspan class="letter" style="animation-delay:0.34s">江</tspan></text>
<text x="500" y="335" text-anchor="middle" font-size="26" letter-spacing="4" class=" enter" style=";animation-delay:0.4s">一名 AI 产品经理</text>
<text x="500" y="400" text-anchor="middle" font-size="22" class="muted enter" style=";animation-delay:0.5s">正在用 AI 做一些自己想用的工具和有趣的小产品。</text>
<rect x="396" y="437" width="208" height="47" rx="23" fill="#9bbca2" fill-opacity=".07" stroke="#91ad96" stroke-opacity=".25" class="enter" style="animation-delay:.6s" />
<text x="500" y="468" text-anchor="middle" font-size="18" class=" enter" style=";animation-delay:0.6s">逛逛我的个人网站 ↗</text>
<path d="M86 540H914" stroke="#819b88" opacity=".16" />
<text x="86" y="599" font-size="13" letter-spacing="3" class="mono dim enter" style=";animation-delay:0.72s">01 / ABOUT ME</text>
<text x="86" y="646" font-size="31" font-weight="500" class=" enter" style=";animation-delay:0.72s">让想法，有机会成为产品。</text>
<text x="86" y="692" font-size="21" class="muted enter" style=";animation-delay:0.72s">我想把 AI 用在具体的问题上，也给有趣的小想法一个实现的机会。</text>
<text x="86" y="729" font-size="21" class="muted enter" style=";animation-delay:0.72s">这里有我做的 AI 工具、产品拆解方法，还有一些出于兴趣的尝试。</text>
<text x="86" y="827" font-size="13" letter-spacing="3" class="mono dim enter" style=";animation-delay:0.87s">02 / THINGS I MAKE</text>
<text x="86" y="872" font-size="31" font-weight="500" class=" enter" style=";animation-delay:0.87s">我做的一些尝试</text>
<text x="86" y="944" font-size="16" class="mono dim enter" style=";animation-delay:1.0s">01</text><text x="135" y="945" font-size="27" font-weight="500" class=" enter" style=";animation-delay:1.0s">Donebara · 水豚验收官</text><text x="912" y="945" font-size="26" text-anchor="end" class=" enter" style=";animation-delay:1.0s">↗</text>
<text x="135" y="983" font-size="20" class="muted enter" style=";animation-delay:1.0s">面向 Codex 的本地完成检查插件。在任务结束前，</text><text x="135" y="1016" font-size="20" class="muted enter" style=";animation-delay:1.0s">检查代码改动是否具备有效的验证证据。</text>
<path d="M86 1052H914" stroke="#819b88" opacity=".16" />
<text x="86" y="1096" font-size="16" class="mono dim enter" style=";animation-delay:1.15s">02</text><text x="135" y="1097" font-size="27" font-weight="500" class=" enter" style=";animation-delay:1.15s">JOKER · 小丑牌</text><text x="912" y="1097" font-size="26" text-anchor="end" class=" enter" style=";animation-delay:1.15s">↗</text>
<text x="135" y="1135" font-size="20" class="muted enter" style=";animation-delay:1.15s">一款受 Balatro 启发的网页卡牌游戏。组合牌型、</text><text x="135" y="1168" font-size="20" class="muted enter" style=";animation-delay:1.15s">收集小丑牌，在对局里尝试不同的得分策略。</text>
<path d="M86 1204H914" stroke="#819b88" opacity=".16" />
<text x="86" y="1248" font-size="16" class="mono dim enter" style=";animation-delay:1.3s">03</text><text x="135" y="1249" font-size="27" font-weight="500" class=" enter" style=";animation-delay:1.3s">产品拆解助手</text><text x="912" y="1249" font-size="26" text-anchor="end" class=" enter" style=";animation-delay:1.3s">↗</text>
<text x="135" y="1287" font-size="20" class="muted enter" style=";animation-delay:1.3s">从截图、网页和代码等一手材料出发，分析产品</text><text x="135" y="1320" font-size="20" class="muted enter" style=";animation-delay:1.3s">体验与技术实现，生成可追溯的拆解报告。</text>
<path d="M86 1370H914" stroke="#819b88" opacity=".16" />
<text x="500" y="1440" text-anchor="middle" font-size="23" class=" enter" style=";animation-delay:1.45s">每个人都有自己独特的想法，</text>
<text x="500" y="1480" text-anchor="middle" font-size="23" class=" enter" style=";animation-delay:1.45s">为什么不尝试把它实现呢？</text>
<text x="500" y="1538" text-anchor="middle" font-size="13" letter-spacing="3" class="mono dim enter" style=";animation-delay:1.45s">GUO YUJIANG · KEEP EXPLORING</text>
