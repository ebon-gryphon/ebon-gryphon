<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title"><title id="title">郭雨江，一名 AI 产品经理。让想法，有机会成为产品。</title>
<defs><radialGradient id="bg"><stop stop-color="#11251a"/><stop offset="1" stop-color="#080e0b"/></radialGradient></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#e0e8e1}.muted{fill:#a7b4aa}.dim{fill:#718577}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.enter{animation:enter .3s ease-out both}.right{animation-delay:.35s}.name{animation-delay:.12s}.role{animation-delay:.22s}@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.enter{animation:none}}</style>
<rect width="1000" height="350" fill="#080e0b"/><ellipse cx="420" cy="160" rx="430" ry="175" fill="url(#bg)" opacity=".55"/>
<text x="68" y="49" font-size="12" letter-spacing="2" class="mono dim">EBON-GRYPHON / PERSONAL SPACE</text>
<g class="enter"><text x="68" y="107" font-size="21" class="muted">嘿！你好，我是</text></g>
<g class="enter name"><text x="65" y="180" font-size="62" font-weight="600" letter-spacing="5">郭雨江</text></g>
<g class="enter role"><text x="68" y="222" font-size="22" class="muted">一名 AI 产品经理</text><text x="68" y="280" font-size="17" class="muted">个人网站 ↗</text></g>
<path d="M449 92V284" stroke="#718577" opacity=".2"/>
<g class="enter right">
<text x="493" y="108" font-size="12" letter-spacing="2" class="mono dim">ABOUT ME</text>
