<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">从一个想法，到一个真正上线的产品</title><desc id="desc">24 秒动画：想法便签、需求流程、界面原型、AI 编程、测试调整、产品上线。演示产品为一个灵感收集工具。</desc>
<defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#dbe3da"/></pattern><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#294a37" flood-opacity=".09"/></filter></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#243c30}.muted{fill:#7c897f}.green{fill:#3d7657}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.scene{opacity:0;animation:scene 24s linear infinite}.b{animation-delay:4s}.c{animation-delay:8s}.d{animation-delay:12s}.e{animation-delay:16s}.f{animation-delay:20s}.line{stroke:#dce5da;fill:none}.ink{stroke:#70927a;fill:none;stroke-width:2}.cursor{animation:blink 1s steps(1) infinite}.grow{transform-origin:50px 456px;animation:grow 24s linear infinite}@keyframes scene{0%{opacity:0;transform:translateY(10px)}2%,14%{opacity:1;transform:translateY(0)}16.5%,100%{opacity:0;transform:translateY(-7px)}}@keyframes blink{50%{opacity:0}}@keyframes grow{0%{transform:scaleX(0)}88%,97%{transform:scaleX(1)}100%{transform:scaleX(0)}}@media(prefers-reduced-motion:reduce){.scene{animation:none;opacity:0}.scene.f{opacity:1}.grow{animation:none}.cursor{animation:none}}
</style>
<rect x="1" y="1" width="998" height="538" rx="18" fill="#f7f9f4" stroke="#dbe3d7"/>
<rect x="390" y="72" width="560" height="347" rx="16" fill="url(#dots)"/>
<text x="48" y="39" font-size="11" letter-spacing="2" class="mono muted">GUO YUJIANG / MAKE IDEAS REAL</text><text x="952" y="39" font-size="12" text-anchor="end" class="muted">一个产品的诞生</text>
<path d="M48 59H952" class="line"/>
<text x="48" y="106" font-size="13" letter-spacing="3" class="green">从 0 到 1</text>
<text x="46" y="164" font-size="35" font-weight="600">想法，</text><text x="46" y="213" font-size="35" font-weight="600">开始有了模样。</text>
<g class="scene "><text x="48" y="295" font-size="13" class="mono green">01 / 冒出一个想法</text><text x="48" y="326" font-size="15" class="muted">让随时出现的灵感，有地方可记。</text><g transform="rotate(-4 665 250)"><rect x="514" y="139" width="310" height="220" rx="5" fill="#fff4c9" filter="url(#shadow)"/><rect x="613" y="128" width="104" height="23" fill="#d9e4d4" opacity=".85"/><text x="545" y="189" font-size="12" class="muted">如果有个小工具……</text><text x="545" y="234" font-size="25" font-weight="600">灵感一闪而过，</text><text x="545" y="271" font-size="25" font-weight="600">能不能先记下来？</text><path d="M545 290H765" stroke="#d8bd70" stroke-width="2"/><text x="545" y="329" font-size="13" class="muted">一个想法，就是起点。</text></g></g><g class="scene b"><text x="48" y="295" font-size="13" class="mono green">02 / 想清楚要解决什么</text><text x="48" y="326" font-size="15" class="muted">把需求，整理成一条简单的流程。</text><rect x="508" y="99" width="317" height="69" rx="9" fill="#fff4c9" stroke="#e6dab4"/><text x="666" y="129" text-anchor="middle" font-size="17" font-weight="600">随手记，不打断思路</text><text x="666" y="151" text-anchor="middle" font-size="12" class="muted">谁来用 · 遇到什么问题</text><path d="M666 168V204M510 224H823M510 224V246M666 204V246M823 224V246" class="ink"/><rect x="448" y="246" width="126" height="66" rx="8" fill="#fff" stroke="#cbd9c7"/><rect x="603" y="246" width="126" height="66" rx="8" fill="#fff" stroke="#cbd9c7"/><rect x="758" y="246" width="126" height="66" rx="8" fill="#fff" stroke="#cbd9c7"/><text x="511" y="285" text-anchor="middle" font-size="16">记录</text><text x="666" y="285" text-anchor="middle" font-size="16">整理</text><text x="821" y="285" text-anchor="middle" font-size="16">找回</text><text x="666" y="363" text-anchor="middle" font-size="13" class="muted">先把最重要的一件事做好。</text></g><g class="scene c"><text x="48" y="295" font-size="13" class="mono green">03 / 设计产品原型</text><text x="48" y="326" font-size="15" class="muted">让流程，变成看得见的界面。</text><rect x="430" y="104" width="476" height="286" rx="12" fill="#fff" stroke="#cfdbcc" filter="url(#shadow)"/><path d="M430 139H906" class="line"/><circle cx="450" cy="122" r="4" fill="#d7dfd2"/><circle cx="464" cy="122" r="4" fill="#d7dfd2"/><circle cx="478" cy="122" r="4" fill="#d7dfd2"/><text x="885" y="126" text-anchor="end" font-size="11" class="muted">灵感簿</text><g fill="none" stroke="#9bac97" stroke-dasharray="5 4"><rect x="453" y="159" width="102" height="206" rx="4"/><rect x="574" y="160" width="216" height="18" rx="3"/><rect x="574" y="195" width="308" height="58" rx="4"/><rect x="574" y="270" width="146" height="95" rx="4"/><rect x="736" y="270" width="146" height="95" rx="4"/></g><text x="475" y="188" font-size="12" class="muted">全部灵感</text><path d="M475 211H532M475 231H523M592 290H688M592 309H679M754 290H850M754 309H836" stroke="#d2dccd" stroke-width="5"/><text x="728" y="232" text-anchor="middle" font-size="13" class="muted">写下一个新想法</text></g><g class="scene d"><text x="48" y="295" font-size="13" class="mono green">04 / 用 AI 编程实现</text><text x="48" y="326" font-size="15" class="muted">把界面背后的功能，一步步接起来。</text><rect x="430" y="104" width="476" height="286" rx="12" fill="#fff" stroke="#cfdbcc" filter="url(#shadow)"/><path d="M430 139H906" class="line"/><circle cx="450" cy="122" r="4" fill="#d7dfd2"/><circle cx="464" cy="122" r="4" fill="#d7dfd2"/><circle cx="478" cy="122" r="4" fill="#d7dfd2"/><text x="885" y="126" text-anchor="end" font-size="11" class="muted">灵感簿</text><rect x="447" y="153" width="210" height="220" rx="6" fill="#edf2e9"/><text x="461" y="179" font-size="12" class="mono green">idea.create()</text><g stroke-linecap="round" stroke-width="5"><path d="M464 201H536M477 219H616M477 237H596M477 255H607M464 273H548" stroke="#98af92"/><path d="M554 201H624M549 273H602M477 291H579" stroke="#c5d2bd"/></g><text x="461" y="346" font-size="11" class="mono green">AI + YOUR IDEA</text><rect x="676" y="163" width="207" height="39" rx="5" fill="#f6f8f2" stroke="#dbe3d7"/><text x="689" y="188" font-size="12">一个新想法</text><rect x="810" y="213" width="73" height="27" rx="5" fill="#477b57"/><text x="846" y="231" text-anchor="middle" font-size="11" fill="white" style="fill:#fff">记录</text><rect x="676" y="255" width="207" height="88" rx="6" fill="#faf3d9"/><text x="690" y="281" font-size="13">周末做一个小产品</text><path d="M690 300H864M690 317H821" stroke="#ddd5b7" stroke-width="4"/><rect x="609" y="289" width="5" height="12" fill="#477b57" class="cursor"/></g><g class="scene e"><text x="48" y="295" font-size="13" class="mono green">05 / 测试，再改一改</text><text x="48" y="326" font-size="15" class="muted">检查真实的使用过程，修好小问题。</text><rect x="430" y="104" width="476" height="286" rx="12" fill="#fff" stroke="#cfdbcc" filter="url(#shadow)"/><path d="M430 139H906" class="line"/><circle cx="450" cy="122" r="4" fill="#d7dfd2"/><circle cx="464" cy="122" r="4" fill="#d7dfd2"/><circle cx="478" cy="122" r="4" fill="#d7dfd2"/><text x="885" y="126" text-anchor="end" font-size="11" class="muted">灵感簿</text><text x="456" y="180" font-size="16" font-weight="600">上线前，试一遍</text><rect x="454" y="196" width="428" height="42" rx="5" fill="#f0f5eb"/><text x="470" y="223" font-size="14" class="green">✓　记录一条想法</text><text x="866" y="223" font-size="12" text-anchor="end" class="green">通过</text><rect x="454" y="247" width="428" height="42" rx="5" fill="#f0f5eb"/><text x="470" y="274" font-size="14" class="green">✓　重新打开，内容还在</text><text x="866" y="274" font-size="12" text-anchor="end" class="green">通过</text><rect x="454" y="298" width="428" height="42" rx="5" fill="#faf3db"/><text x="470" y="325" font-size="14">↻　手机上的排版</text><text x="866" y="325" font-size="12" text-anchor="end" class="green">调整完成</text><text x="455" y="363" font-size="11" class="muted">从“能运行”，到“可以用”。</text></g><g class="scene f"><text x="48" y="295" font-size="13" class="mono green">06 / 产品，正式上线</text><text x="48" y="326" font-size="15" class="muted">让一个人的想法，成为可用的产品。</text><rect x="430" y="104" width="476" height="286" rx="12" fill="#fff" stroke="#cfdbcc" filter="url(#shadow)"/><path d="M430 139H906" class="line"/><circle cx="450" cy="122" r="4" fill="#d7dfd2"/><circle cx="464" cy="122" r="4" fill="#d7dfd2"/><circle cx="478" cy="122" r="4" fill="#d7dfd2"/><text x="885" y="126" text-anchor="end" font-size="11" class="muted">灵感簿</text><rect x="450" y="157" width="100" height="212" rx="5" fill="#edf2e9"/><text x="466" y="186" font-size="16" font-weight="600">灵感簿</text><text x="466" y="222" font-size="11" class="green">我的灵感</text><text x="466" y="249" font-size="11" class="muted">收藏与整理</text><text x="571" y="183" font-size="18" font-weight="600">好想法，值得实现。</text><text x="571" y="206" font-size="11" class="muted">记下它，也给它一个开始。</text><rect x="571" y="224" width="313" height="39" rx="5" fill="#f7f9f3" stroke="#dce3d7"/><text x="586" y="249" font-size="12" class="muted">此刻，你在想什么？</text><rect x="571" y="280" width="148" height="74" rx="6" fill="#fff3c7"/><rect x="734" y="280" width="150" height="74" rx="6" fill="#edf3e7"/><text x="586" y="307" font-size="12">我的第一个产品</text><text x="586" y="333" font-size="11" class="muted">从想法开始</text><text x="749" y="307" font-size="12">下一个小点子</text><text x="749" y="333" font-size="11" class="muted">继续探索</text><rect x="737" y="78" width="186" height="35" rx="17" fill="#3d7657"/><text x="830" y="101" text-anchor="middle" font-size="13" style="fill:#fff">✓  已上线 · HELLO WORLD</text></g><path d="M48 455H952" class="line" stroke-width="2"/><path d="M50 455H952" stroke="#72937a" stroke-width="2" class="grow"/>
<text x="48" y="487" font-size="15">每个人都有自己独特的想法，为什么不尝试把它实现呢？</text><text x="48" y="517" font-size="12" class="muted">郭雨江 · 一名 AI 产品经理</text><text x="952" y="517" text-anchor="end" font-size="12" class="green">进入我的个人网站 ↗</text></svg>